# Project Health Checker — container orchestration.
#
# Start the web UI on http://localhost:8080 with:
#
#     docker compose up
#
# The service builds the image from the local Dockerfile and persists its
# config and generated output via bind mounts. Credentials are intentionally
# NOT persisted: they live only in the running container's memory and must be
# re-entered on the Credentials page after each restart (and kiro-cli re-login
# via `docker compose exec`).

services:
  health-checker:
    build:
      context: .
      # kiro-cli is installed by default. It is a large (~400 MB) binary, so set
      # INSTALL_KIRO_CLI=false to skip it when you only use the codex or
      # cursor-agent backends:  INSTALL_KIRO_CLI=false docker compose build
      args:
        INSTALL_KIRO_CLI: "${INSTALL_KIRO_CLI:-true}"
    image: health-checker-agent
    ports:
      - "8080:8080"
    environment:
      HEALTH_CHECKER_CONFIG: /app/repos.toml
      HEALTH_CHECKER_HOST: 0.0.0.0
      HEALTH_CHECKER_PORT: "8080"
    volumes:
      # The repo list the UI edits. Seeded from repos.toml.example on first run
      # if absent.
      - ./repos.toml:/app/repos.toml
      # Generated memos, fleet report, pptx, and repo clones.
      - ./output:/app/output
    restart: unless-stopped
