[project]
name = "health-checker-agent"
version = "0.1.0"
description = "An agent that analyses GitHub project activity into a management memo and health report."
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
# Required only for the optional PowerPoint export (`--pptx`).
pptx = ["python-pptx>=1.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["health_checker_agent*"]
